name: Release

on:
  push:
    tags: ["v*"]

# npm authenticates through the OIDC token minted by id-token: write, so no npm
# token is stored in this repository. Requires a trusted publisher configured on
# npmjs.com for this repository and workflow file.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Trusted publishing requires npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - name: Verify the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match package.json version $version"
            exit 1
          fi
      # prepublishOnly runs the full gate (lint, format, typecheck, tests, build).
      - run: npm publish --provenance
